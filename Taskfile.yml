  # ============================================================================
  # FRONTEND DEVELOPMENT TASKS
  # ============================================================================

  dev:
    desc: Run frontend development server (port 3000)
    cmds:
      - pnpm dev

  "dev:contracts":
    desc: Watch and rebuild contracts on changes
    watch: true
    sources:
      - src/**/*.sol
    cmds:
      - task: build

  type-check:
    desc: Run TypeScript type checking
    cmds:
      - pnpm type-check

  generate:
    desc: Generate Wagmi types from contract ABIs
    cmds:
      - pnpm generate

  sync-configs:
    desc: Sync deployment configs to subgraph
    cmds:
      - pnpm sync-configs

  update-deployments:
    desc: Update frontend deployment addresses from networks.json
    cmds:
      - pnpm update-deployments

  # ============================================================================
  # SUBGRAPH TASKS
  # ============================================================================

  "subgraph:build":
    desc: Build subgraph for deployment
    dir: pkg/subgraph
    cmds:
      - pnpm build

  "subgraph:deploy:gnosis":
    desc: Deploy subgraph to Graph Studio (Gnosis)
    dir: pkg/subgraph
    cmds:
      - pnpm deploy:gnosis

  "subgraph:manifest:gnosis":
    desc: Generate subgraph manifest for Gnosis
    dir: pkg/subgraph
    cmds:
      - pnpm manifest:gnosis

  # ============================================================================
  # HELPER TASKS
  # ============================================================================

  setup:
    desc: Complete project setup (install deps, build contracts & frontend)
    cmds:
      - echo "🔧 Setting up project..."
      - task: install
      - echo ""
      - echo "🏗️  Building contracts..."
      - task: build
      - echo ""
      - echo "📦 Installing frontend dependencies..."
      - pnpm install
      - echo ""
      - echo "✅ Setup complete! Run 'task dev' to start development server"

  doctor:
    desc: Check development environment setup
    cmds:
      - echo "🔍 Checking development environment..."
      - echo ""
      - echo "📌 Forge version:"
      - forge --version
      - echo ""
      - echo "📌 pnpm version:"
      - pnpm --version
      - echo ""
      - echo "📌 Node version:"
      - node --version
      - echo ""
      - echo "📌 Task version:"
      - task --version
      - echo ""
      - echo "✅ All tools installed correctly!"

  list:
    desc: List all available tasks with descriptions
    cmds:
      - task --list-all

  help:
    desc: Show help and common commands
    cmds:
      - |
        echo "Owner Sync Safe - Task Commands"
        echo ""
        echo "📚 Common Commands:"
        echo "  task build           - Build contracts"
        echo "  task test            - Run all tests"
        echo "  task dev             - Run frontend dev server"
        echo "  task setup           - Complete project setup"
        echo "  task doctor          - Check environment"
        echo "  task list            - List all tasks"
        echo ""
        echo "🚀 Deployment:"
        echo "  task deploy:registry:gnosis    - Deploy to Gnosis Chain"
        echo "  task deploy:registry:base      - Deploy to Base"
        echo "  task deploy:registry:arbitrum  - Deploy to Arbitrum"
        echo ""
        echo "⬆️  Upgrades:"
        echo "  task upgrade:registry:gnosis         - Upgrade Registry"
        echo "  task upgrade:manager-template:gnosis - Update Manager template"
        echo "  task upgrade:module-template:gnosis  - Update Module template"
        echo ""
        echo "📖 Full list: task --list-all"

  # Default task when running just "task"
  default:
    desc: Show help
    cmds:
      - task: help
