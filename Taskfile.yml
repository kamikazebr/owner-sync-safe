version: '3'

# Automatically load environment variables from .env file
dotenv: ['.env']

# Global variables
vars:
  OPTIMIZER_RUNS: 1000000
  GNOSIS_CHAIN_ID: 100
  GNOSIS_GAS_PRICE: 5gwei
  GNOSIS_PRIORITY_GAS: 1gwei
  BASE_CHAIN_ID: 8453
  ARBITRUM_CHAIN_ID: 42161
  OPTIMISM_CHAIN_ID: 10
  POLYGON_CHAIN_ID: 137
  CELO_CHAIN_ID: 42220

# ============================================================================
# CORE DEVELOPMENT TASKS
# ============================================================================

tasks:
  # Clean forge build artifacts
  clean:
    desc: Clean forge build artifacts
    cmds:
      - forge clean

  # Build contracts with optimization
  build:
    desc: Build contracts with optimization (1M optimizer runs)
    cmds:
      - forge clean
      - forge build --optimize --optimizer-runs {{.OPTIMIZER_RUNS}}

  # Run all tests
  test:
    desc: Run all Forge tests with verbose output
    cmds:
      - forge clean
      - forge test --optimize --optimizer-runs {{.OPTIMIZER_RUNS}} -vvv

  # Run specific test file
  "test:file":
    desc: "Run specific test file (Usage: task test:file FILE=SafeModuleManagerTest.t.sol)"
    cmds:
      - forge test --match-path test/{{.FILE}} -vvv

  # Run specific test function
  "test:function":
    desc: "Run specific test function (Usage: task test:function FUNC=testCreateModuleForSafe)"
    cmds:
      - forge test --match-test {{.FUNC}} -vvv

  # Generate gas snapshots
  snapshot:
    desc: Generate gas usage snapshots
    cmds:
      - forge clean
      - forge snapshot --optimize --optimizer-runs {{.OPTIMIZER_RUNS}}

  # Check contract sizes
  check-sizes:
    desc: Check contract sizes (EIP-170 limit is 24,576 bytes)
    cmds:
      - forge build --sizes

  # ============================================================================
  # LIBRARY MANAGEMENT
  # ============================================================================

  # Install forge libraries
  "libs:install":
    desc: Install forge library dependencies
    cmds:
      - forge install --no-git dapphub/ds-test@9310e879db8ba3ea6d5c6489a579118fd264a3f5
      - forge install --no-git foundry-rs/forge-std@564510058ab3db01577b772c275e081e678373f2
      - forge install --no-git rari-capital/solmate@eaaccf88ac5290299884437e1aee098a96583d54
      - forge install --no-git OpenZeppelin/openzeppelin-contracts@v4.6.0
      - forge install --no-git contracts-upgradeable=OpenZeppelin/openzeppelin-contracts-upgradeable@v4.6.0
      - forge install --no-git gnosis/safe-contracts@v1.3.0-libs.0 gnosis/zodiac@v1.0.10

  # Fix OpenZeppelin directory structure
  fix-zeppelin:
    desc: Fix OpenZeppelin contracts-upgradeable directory structure
    cmds:
      - mv lib/contracts-upgradeable/contracts lib/openzeppelin-contracts/contracts-upgradeable
      - rm -rf lib/contracts-upgradeable
      - echo "✅ OpenZeppelin structure fixed"

  # Complete installation (libs + fix)
  install:
    desc: Install all dependencies and fix structure
    deps: [libs:install]
    cmds:
      - task: fix-zeppelin

  # ============================================================================
  # DEPLOYMENT TASKS - GNOSIS CHAIN
  # ============================================================================

  "deploy:registry:gnosis":
    desc: Deploy SyncGroupRegistry to Gnosis Chain
    deps: [test]
    preconditions:
      - test -f .env
      - sh: test -n "{{.RPC_URL_GNOSIS}}"
        msg: "RPC_URL_GNOSIS not set in .env"
      - sh: test -n "{{.ETHERSCAN_API_KEY}}"
        msg: "ETHERSCAN_API_KEY not set in .env"
    cmds:
      - echo "🚀 Deploying SyncGroupRegistry to Gnosis Chain..."
      - |
        forge script script/DeployUUPSMultiChain.s.sol:DeployUUPSMultiChain \
          --rpc-url {{.RPC_URL_GNOSIS}} \
          --account pkf \
          --sig "deployRegistry(string)" 'gnosis' \
          --chain-id {{.GNOSIS_CHAIN_ID}} \
          --with-gas-price {{.GNOSIS_GAS_PRICE}} \
          --priority-gas-price {{.GNOSIS_PRIORITY_GAS}} \
          --broadcast \
          --legacy \
          --verify \
          --etherscan-api-key {{.ETHERSCAN_API_KEY}} \
          -vvv
      - echo ""
      - echo "📝 Updating networks.json..."
      - ./scripts/update-deployment-addresses.sh gnosis registry
      - echo ""
      - echo "🔄 Syncing configs to subgraph..."
      - pnpm sync-configs
      - echo ""
      - echo "✅ Deployment complete!"

  # ============================================================================
